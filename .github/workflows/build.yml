name: Build Boobies Soundpad

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single exe
        run: dotnet publish BoomBx.csproj -c Release -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: BoobiesSoundpad-win-x64
          path: publish/BoobiesSoundpad.exe

      - name: Create release (on version tags like v0.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/BoobiesSoundpad.exe
          generate_release_notes: true
